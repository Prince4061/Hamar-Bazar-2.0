services:
  hamar-bazar:
    image: princekaushik9926/hamar-bazar:latest
    container_name: hamar-bazar-container
    restart: always
    ports:
      - "5001:5001"
    networks:
      - app-network
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_PATH=${DATABASE_PATH}
    volumes:
      - db_data:/app/data
      - uploads_data:/app/static/uploads
      - downloads_data:/app/static/downloads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hamar-bazar-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
  downloads_data:
