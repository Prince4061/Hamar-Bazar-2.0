services:
  hamar-bazar:
    image: princekaushik9926/hamar-bazar-2.0:latest
    container_name: hamar-bazar-container
    restart: always
    ports:
      - "5001:5001"
    networks:
      - app-network
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_PATH=${DATABASE_PATH}
    volumes:
      - db_data:/app/data
      - uploads_data:/app/static/uploads
      - downloads_data:/app/static/downloads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hamar-bazar-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-container
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
  downloads_data:
  n8n_data:
