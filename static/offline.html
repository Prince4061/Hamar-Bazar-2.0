<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamar Bazaar - Offline</title>
    <style>
        :root {
            --primary-accent: #5e17eb;
            --emerald-green: #15803d;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --bg-main: #f8fafc;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin: 16px;
        }
        .icon {
            font-size: 48px;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            font-weight: 800;
        }
        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        .btn {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 24px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(94, 23, 237, 0.2);
        }
        .btn:hover {
            background-color: #4c11c9;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📶❌</div>
        <h1>Aap Offline Hain</h1>
        <p>Hamar Bazaar ko chalane ke liye internet connection zaroori hai. Kripya apna connection check karein aur dobara koshish karein.</p>
        <button class="btn" onclick="window.location.reload()">Dobara Koshish Karein</button>
    </div>
</body>
</html>
